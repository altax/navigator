kind = "web"
previewPath = "/"
title = "Карта курьера — СПб и ЛО"
version = "1.0.0"
id = "artifacts/courier-map"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19218

[services.development]
run = "pnpm --filter @workspace/courier-map run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/courier-map", "run", "build" ]
publicDir = "artifacts/courier-map/out"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19218"
BASE_PATH = "/"
