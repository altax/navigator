<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Карта курьера — СПб и ЛО</title>
    <meta name="description" content="Личная карта курьера: подъезды, проходы, заметки. PostGIS + MapLibre + PMTiles + GraphHopper." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Шрифты карты: загружаем до того, как MapLibre начнёт рендерить лейблы.
      Без preload шрифты грузятся в момент первого рендера тайлов — пустые лейблы
      мигают 200-500 мс. С preload они уже в кеше к нужному моменту.

      Диапазоны:
        0-255    — ASCII + Latin (адреса, POI на латинице)
        256-511  — Latin Extended (европейские символы)
        1024-1279 — Кириллица (русские названия — основной алфавит)
    -->
    <link rel="preload" as="fetch" crossorigin href="/api/tiles/font/Noto%20Sans%20Regular/0-255.pbf" />
    <link rel="preload" as="fetch" crossorigin href="/api/tiles/font/Noto%20Sans%20Regular/256-511.pbf" />
    <link rel="preload" as="fetch" crossorigin href="/api/tiles/font/Noto%20Sans%20Regular/1024-1279.pbf" />
    <link rel="preload" as="fetch" crossorigin href="/api/tiles/font/Noto%20Sans%20Bold/0-255.pbf" />
    <link rel="preload" as="fetch" crossorigin href="/api/tiles/font/Noto%20Sans%20Bold/256-511.pbf" />
    <link rel="preload" as="fetch" crossorigin href="/api/tiles/font/Noto%20Sans%20Bold/1024-1279.pbf" />

    <!-- Главный модуль: даём браузеру начать парсинг как можно раньше -->
    <link rel="modulepreload" href="/src/main.tsx" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
