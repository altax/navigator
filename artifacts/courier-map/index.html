<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Карта курьера — СПб и ЛО</title>
    <meta name="description" content="Личная карта курьера: подъезды, проходы, заметки. PostGIS + MapLibre + PMTiles + GraphHopper." />

    <!--
      Шрифты карты НЕ грузим через <link rel="preload">.
      MapLibre запрашивает их через WebWorker — браузер не может сопоставить
      preload с воркерным запросом и выбрасывает предупреждения в консоль.
      Service Worker прогревает шрифты при установке (WARMUP_FONTS в sw.js)
      и отдаёт их из кеша напрямую — без лишних запросов.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
